<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tylko suche żarty oraz gry słowne w postaci rysunkowej.">
    <link rel="canonical" href="https://suharskiego.pl/">
    <title>Suharskiego</title>
    <link rel="preload" href="drawings.json" as="fetch" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <script type="module" src="script.js"></script>
</head>
<body>
    <svg style="display: none" aria-hidden="true">
        <symbol id="icon-instagram" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="0.5"></circle>
        </symbol>
        <symbol id="icon-link" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </symbol>
    </svg>

    <header id="header">
        <h1 class="logo-container">
            <img class="logo" src="logo-256.webp" srcset="logo-96.webp 96w, logo-256.webp 256w"
                 sizes="(min-width: 768px) 5vw, 8vw" width="256" height="256" alt="">
            <img class="second-logo" src="logo_text-1385.webp" srcset="logo_text-640.webp 640w, logo_text-1385.webp 1385w"
                 sizes="(min-width: 768px) 45vw, 72vw" width="1385" height="226" alt="Suharskiego">
        </h1>
    </header>
    <main>
        <div id="drawings-container"></div>
    </main>

    <template id="drawing-template">
        <div class="drawing-container">
            <div class="carousel">
                <img class="slide active" decoding="async">
                <img class="slide" decoding="async">
                <a class="icon-link instagram-link" target="_blank" rel="noopener" aria-label="Zobacz na Instagramie">
                    <svg class="icon" aria-hidden="true"><use href="#icon-instagram"></use></svg>
                </a>
                <a class="icon-link copy-link" aria-label="Skopiuj link do rysunku">
                    <svg class="icon" aria-hidden="true"><use href="#icon-link"></use></svg>
                </a>
                <span class="copy-message" role="status"></span>
                <button type="button" class="arrow left" aria-label="Poprzedni slajd" hidden>&lsaquo;</button>
                <button type="button" class="arrow right" aria-label="Następny slajd">&rsaquo;</button>
                <div class="dots">
                    <button type="button" class="dot active" aria-label="Slajd 1" aria-current="true"></button>
                    <button type="button" class="dot" aria-label="Slajd 2"></button>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
